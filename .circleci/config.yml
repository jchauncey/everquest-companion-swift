# CI for EQ Companion.
#
# WHAT THIS CAN AND CANNOT PROVE.
#
#   * Parity with the Rust engine, for the committed fixtures: YES. `ci/goldens.tar.xz` (~1.3 MB) is
#     every fixture's golden set — events, snapshots, views, ops — cut from the upstream RUST engine
#     and packed by `make goldens-pack`. CI unpacks it into `Goldens/` before the tests, so the
#     parser, fold, ops and knowledge oracles run here exactly as they do locally, and they fail
#     (not skip) on a fixture without its golden.
#   * The owner's own log (`_real`) and EverQuest install: NO. Neither is committed or can be; the
#     real-log and map-pack suites skip here. The "What was skipped" step prints the count on every
#     run so this never goes unnoticed: a check that quietly proves less than it appears to is
#     worse than no check at all.
#
# What CI also proves: the whole package and the Tools package compile under a clean toolchain from
# a bare checkout, and every test needing neither of the owner's inputs passes.
#
# ONE JOB, NO DEPENDENCY CACHE, deliberately: the package has no external dependencies (every target
# is local, and Tools/ depends on the root by path), so there is no `Package.resolved` to key a
# cache on and nothing to fetch. Splitting build and test across two executors would simply compile
# everything twice.
version: 2.1

jobs:
  verify:
    macos:
      # CLAUDE.md's floor is Xcode 16 / Swift 6; the owner builds on 26.2. Pin an image CircleCI
      # actually publishes, and move it deliberately — a silent bump is a silent toolchain change.
      xcode: 16.2.0
    resource_class: macos.m1.medium.gen1
    environment:
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - checkout
      - run:
          name: Toolchain
          command: swift --version && xcodebuild -version
      - run:
          name: Build every target
          command: make build
      - run:
          name: Build the developer tools (Tools/ is a separate package)
          command: make tools
      - run:
          name: Unpack the fixture goldens
          command: make goldens-unpack
      - run:
          name: Tests
          # The raw output is what a failure needs, so it is kept rather than prettified.
          command: make test 2>&1 | tee /tmp/test.log
      - run:
          name: What was skipped, and why
          when: always
          # XCTest writes one "' skipped (" line per skipped test and a "Test skipped - <reason>"
          # line carrying the reason the test itself gave. Both are counted and the distinct
          # reasons printed, so a green build states in its own log exactly what it did not check.
          command: |
            count=$(grep -c "' skipped (" /tmp/test.log || true)
            echo "Skipped tests: ${count:-0}"
            echo
            echo "Reasons given by the tests themselves:"
            grep -o 'Test skipped - .*' /tmp/test.log | sort | uniq -c | sort -rn || echo "  (none)"
            echo
            echo "The fixture goldens were unpacked from ci/goldens.tar.xz, so parity with the Rust"
            echo "engine IS checked for every committed fixture. The real-log (_real) and map-pack"
            echo "suites need the owner's own log and EverQuest install, which CI cannot have."
      - store_artifacts:
          path: /tmp/test.log
          destination: test.log

workflows:
  every_push:
    jobs:
      - verify
